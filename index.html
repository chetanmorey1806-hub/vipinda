<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vipin Tatad — Multilingual Rapper, Writer & Audio-Visual Storyteller from Maharashtra, India." />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=Teko:wght@500;600&family=Mukta:wght@400;500;700&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet" />
    <script>
      // apply saved / system theme before first paint (no flash)
      try {
        var t = localStorage.getItem('vt-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = t
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
      try {
        var l = localStorage.getItem('vt-lang')
        if (l === 'hi' || l === 'mr') document.documentElement.lang = l
      } catch (e) {}
    </script>
    <title>Vipin Tatad — Rapper · Writer · Storyteller</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
